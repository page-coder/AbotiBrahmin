    <section style="margin-bottom:2rem;">
      <h2 style="font-family:var(--font-heading);font-size:1.55rem;color:var(--temple-brown);">Mission &amp; Historiographical Principles</h2>
      <p data-en="The AbotiBrahmin Digital Encyclopedia was founded to provide a trustworthy, beautifully crafted, bilingual repository of knowledge concerning the Aboti Brahmin community of western India. It adheres to strict epistemic standards: clearly segregating independently verified archival records from community folklore, avoiding exaggerated historical claims, and providing full source citations." data-gu="આ જ્ઞાનકોશનો ઉદ્દેશ્ય અબોટી બ્રાહ્મણ સમુદાયના ઇતિહાસનું પ્રમાણભૂત, સુંદર અને દ્વિભાષી દસ્તાવેજીકરણ કરવાનો છે. તે ઐતિહાસિક તથ્યો અને લોકસ્મૃતિ વચ્ચે સ્પષ્ટ ભેદરેખા રાખે છે."></p>
    </section>

    <section style="margin-bottom:2rem;">
      <h2 style="font-family:var(--font-heading);font-size:1.55rem;color:var(--temple-brown);">Zero-Cost Open Web Architecture</h2>
      <p data-en="Built entirely with semantic HTML5, modern CSS, and lightweight vanilla JavaScript, the encyclopedia runs smoothly without servers, tracking cookies, or paid database dependencies. It is optimized for instant deployment to GitHub Pages and full readability on mobile devices." data-gu="શુદ્ધ HTML5, CSS અને જાવાસ્ક્રીપ્ટમાં બનેલી આ સાઇટ કોઈ પણ ડેટાબેઝ કે સર્વર વિના ગિટહબ પેજીસ પર ઝડપથી ચાલે છે અને મોબાઇલ પર સરળતાથી વાંચી શકાય છે."></p>
